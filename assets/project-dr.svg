<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-1" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E2E8F0" />
    </pattern>
  </defs>
  <rect width="600" height="360" fill="#FFFDF5" />
  <rect width="600" height="360" fill="url(#grid-pattern-1)" />

  <!-- Background decorative geometric shapes -->
  <circle cx="480" cy="80" r="70" fill="#FBBF24" stroke="#1E293B" stroke-width="2.5" />
  <rect x="50" y="240" width="90" height="90" rx="16" fill="#F472B6" stroke="#1E293B" stroke-width="2.5" transform="rotate(12 95 285)" />
  <path d="M 420 280 Q 450 250 480 280 T 540 280" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />

  <!-- Retinal Scanner Mockup Screen (Sticker style) -->
  <g transform="translate(110, 40)">
    <!-- Hard shadow -->
    <rect x="8" y="8" width="380" height="260" rx="20" fill="#1E293B" />
    <!-- Card window -->
    <rect x="0" y="0" width="380" height="260" rx="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="380" height="42" rx="20" fill="#8B5CF6" stroke="#1E293B" stroke-width="3" />
    <circle cx="25" cy="21" r="6" fill="#F472B6" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="45" cy="21" r="6" fill="#FBBF24" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="65" cy="21" r="6" fill="#34D399" stroke="#1E293B" stroke-width="1.5" />
    <text x="190" y="26" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">CNN Vision Diagnostic • 92% Acc</text>

    <!-- Eye / Fundus Scan Circle -->
    <g transform="translate(190, 150)">
      <circle cx="0" cy="0" r="75" fill="#FFF9E6" stroke="#1E293B" stroke-width="2.5" />
      <circle cx="0" cy="0" r="55" fill="#FFE4E6" stroke="#F472B6" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="28" fill="#1E293B" />
      <circle cx="-8" cy="-8" r="8" fill="#FFFFFF" />
      
      <!-- Blood Vessels & Neural Heatmap lines -->
      <path d="M -40 -20 Q -15 -10 0 0 Q 20 -25 45 -15" fill="none" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -30 25 Q -10 10 0 0 Q 15 20 35 30" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Bounding Box detection -->
      <rect x="10" y="-35" width="35" height="35" fill="none" stroke="#34D399" stroke-width="2.5" stroke-dasharray="3 3" />
      <rect x="10" y="-47" width="35" height="12" rx="3" fill="#34D399" />
      <text x="27" y="-38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#1E293B" text-anchor="middle">LESION</text>
    </g>

    <!-- Float Badge -->
    <g transform="translate(240, 60)">
      <rect x="4" y="4" width="110" height="34" rx="17" fill="#1E293B" />
      <rect x="0" y="0" width="110" height="34" rx="17" fill="#34D399" stroke="#1E293B" stroke-width="2" />
      <text x="55" y="22" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#1E293B" text-anchor="middle">STAGE 2 DETECTED</text>
    </g>
  </g>
</svg>
