      <text x="280" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#1E293B">100%</text>

      <!-- Metric Bar 2 -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="320" height="44" rx="10" fill="#FFFDF5" stroke="#1E293B" stroke-width="2" />
        <circle cx="24" cy="22" r="14" fill="#F472B6" stroke="#1E293B" stroke-width="1.5" />
        <text x="24" y="26" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">C2</text>
        <text x="48" y="20" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#1E293B">Teaching & Learning</text>
        <rect x="48" y="26" width="180" height="8" rx="4" fill="#E2E8F0" />
