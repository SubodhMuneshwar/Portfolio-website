<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-4" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E2E8F0" />
    </pattern>
  </defs>
  <rect width="600" height="360" fill="#FFFDF5" />
  <rect width="600" height="360" fill="url(#grid-pattern-4)" />

  <circle cx="90" cy="270" r="55" fill="#F472B6" stroke="#1E293B" stroke-width="2.5" />
  <polygon points="510,40 570,140 450,140" fill="#34D399" stroke="#1E293B" stroke-width="2.5" />

  <!-- NAAC Management Screen -->
  <g transform="translate(110, 40)">
    <rect x="8" y="8" width="380" height="260" rx="20" fill="#1E293B" />
    <rect x="0" y="0" width="380" height="260" rx="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="380" height="42" rx="20" fill="#34D399" stroke="#1E293B" stroke-width="3" />
    <circle cx="25" cy="21" r="6" fill="#8B5CF6" stroke="#1E293B" stroke-width="1.5" />
