      <text x="24" y="26" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">C1</text>
      <text x="48" y="20" font-family="'Outfit', sans-serif" font-weight="700" font-size="11" fill="#1E293B">Curricular Aspects</text>
      <rect x="48" y="26" width="180" height="8" rx="4" fill="#E2E8F0" />
